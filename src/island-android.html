<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Остров Тука</title>
<!-- Остров Тука поверх приложений на Android: страница живёт в прозрачном WebView оверлея.
     Фона нет вовсе — на экране только персонаж, облачко и значок. -->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #tuk { position: absolute; left: 0; top: 0; width: 80px; height: 64px; display: block; }
  /* облачко справа от Тука, на уровне лица (как в нативном острове) */
  #bubble {
    position: absolute; left: 74px; top: 10px; height: 26px; max-width: 160px; padding: 0 10px;
    border-radius: 13px; background: rgba(22, 22, 28, .92); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .24);
    color: #fff; font: 12px/26px system-ui, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .18s ease-out;
  }
  #bubble.on { opacity: 1; }
  #bubble.none { display: none; }
  #badge {
    position: absolute; left: 51px; top: 3px; width: 14px; height: 14px; border-radius: 7px;
    background: #ff5c5c; color: #fff; font: bold 9px/14px system-ui, sans-serif; text-align: center;
    display: none;
  }
</style>
</head>
<body>
<canvas id="tuk"></canvas>
<div id="bubble" class="none"></div>
<div id="badge"></div>
<script type="module" src="./island-android.js"></script>
</body>
</html>
