[package]
name = "tuk"
version = "0.1.0"
description = "Тук — офлайн-помощник для Windows и Android"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tuk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
# события и ответы команд (файлы, остров, локальный ИИ); уже есть в дереве Tauri
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# второй запуск Tuk.exe открывает остров первого, а не второй экземпляр
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Storage_Streams"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-tuk = { path = "./tauri-plugin-tuk" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
