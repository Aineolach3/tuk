# Сборка Тука на серверах GitHub: APK для Android и установщик для Windows.
# Запускается при каждой загрузке файлов или вручную: вкладка Actions → «Сборка Тука» → Run workflow.
name: Сборка Тука

on:
  push:
  workflow_dispatch:

# новая загрузка отменяет недоделанную старую сборку
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: APK для Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на серверах GitHub, доставляем NDK и платформу
      - name: Android NDK и платформа
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      - name: Тесты
        run: npm test

      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon.png
          npx tauri android build --apk --debug --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows:
    name: Установщик для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      - name: Сборка установщика
        run: npx tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Выкладывает готовые файлы в Releases — их видно в приложении GitHub и на сайте
  release:
    name: Публикация в Releases
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          for f in out/*.apk; do [ -e "$f" ] && mv "$f" out/Tuk-android.apk; done
          TAG="build-${{ github.run_number }}"
          NOTES="Сборка №${{ github.run_number }}. Android: ${{ needs.android.result }}, Windows: ${{ needs.windows.result }}.
          На телефоне скачайте Tuk-android.apk, на ПК — файл *setup.exe."
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --title "Тук, сборка ${{ github.run_number }}" --notes "$NOTES" --latest
