# Сборка Тука на серверах GitHub: APK для Android и установщик для Windows.
# Запускается при каждой загрузке файлов или вручную: вкладка Actions → «Сборка Тука» → Run workflow.
name: Сборка Тука

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: APK для Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android NDK и платформа
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      - name: Тесты
        run: npm test

      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon.png
          npx tauri android build --apk --debug --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows:
    name: Установщик для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      - name: Сборка установщика
        run: npx tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
