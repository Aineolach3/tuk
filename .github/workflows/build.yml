# Сборка Тука на серверах GitHub: APK для Android и установщик для Windows.
# Запускается при каждой загрузке файлов или вручную: вкладка Actions → «Сборка Тука» → Run workflow.
name: Сборка Тука

on:
  push:
  workflow_dispatch:

# новая загрузка отменяет недоделанную старую сборку
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: APK для Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на серверах GitHub, доставляем NDK и платформу
      - name: Android NDK и платформа
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      - name: Тесты
        run: npm test

      # мозг (llama.cpp) собирается под телефон отдельно; голос (sherpa-onnx) — готовые библиотеки
      - name: Кэш нативного мозга
        id: llmcache
        uses: actions/cache@v4
        with:
          path: /tmp/tukllm
          key: tukllm-b8999-${{ hashFiles('src-tauri/tauri-plugin-tuk/native/**') }}

      - name: Мозг для Android (llama.cpp)
        if: steps.llmcache.outputs.cache-hit != 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          git clone -q --depth 1 --branch b8999 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          set -o pipefail
          cmake -S src-tauri/tauri-plugin-tuk/native -B /tmp/llm-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR=/tmp/llama.cpp \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 2>&1 | tail -20
          if ! cmake --build /tmp/llm-build -j4 --target tukllm 2>&1 | tee llm.log | grep -E "error|Built target"; then
            grep -E -B2 -A6 "error" llm.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=llama.cpp::/'
            exit 1
          fi
          mkdir -p /tmp/tukllm
          cp /tmp/llm-build/libtukllm.so /tmp/tukllm/
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" /tmp/tukllm/libtukllm.so
          ls -la /tmp/tukllm

      - name: Голос для Android (sherpa-onnx)
        run: |
          J=src-tauri/tauri-plugin-tuk/android/src/main/jniLibs/arm64-v8a
          mkdir -p "$J"
          cp /tmp/tukllm/libtukllm.so "$J/"
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2 -o /tmp/sherpa.tar.bz2
          tar -xjf /tmp/sherpa.tar.bz2 -C /tmp ./jniLibs/arm64-v8a
          cp /tmp/jniLibs/arm64-v8a/libsherpa-onnx-jni.so /tmp/jniLibs/arm64-v8a/libonnxruntime.so "$J/"
          ls -la "$J"

      # постоянный ключ подписи: иначе каждая сборка подписана новым случайным ключом
      # и Android отказывается ставить обновление поверх («Приложение не установлено»)
      - name: Постоянный ключ подписи
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon.png
          node scripts/patch-android.mjs
          find src-tauri/gen/android/app/src/main/res -name themes.xml -exec cat {} \;
          set -o pipefail
          if ! npx tauri android build --apk --debug --target aarch64 --ci 2>&1 | tee build.log; then
            # ошибки — в аннотации, чтобы их было видно без скачивания логов
            grep -E -A6 "^error|error:|FAILURE|What went wrong|Exception" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=Android::/'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows:
    name: Установщик для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm install

      # «Тук Тук» и живой голос на ПК: распознавание Vosk и синтез sherpa-onnx — готовые DLL.
      # Тук грузит их на лету (src-tauri/src/voice/win.rs); версии и отпечатки закреплены,
      # раскладка структур sherpa-onnx в voice/ffi.rs сверена именно с v1.13.8.
      - name: Голос для Windows (Vosk и sherpa-onnx)
        shell: bash
        run: |
          set -euo pipefail
          D=src-tauri/voice-libs
          # относительные пути и tar.exe из Windows (bsdtar: и zip, и tar.bz2)
          mkdir -p "$D" vl
          curl -fsSL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip -o vl/vosk.zip
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-win-x64-shared-MT-Release.tar.bz2 -o vl/sherpa.tar.bz2
          ( cd vl && sha256sum -c - ) <<'SUMS'
          f1dcc9cca460630f81ea8f71794f69c80bed6556d2a4e6237b5785e1d2dff34b  vosk.zip
          6dffdc715a4465b989446a6105265d2cb345e7101591a17d35534b6758f6e8df  sherpa.tar.bz2
          SUMS
          ( cd vl && /c/Windows/System32/tar.exe -xf vosk.zip && /c/Windows/System32/tar.exe -xf sherpa.tar.bz2 )
          cp vl/vosk-win64-0.3.45/{libvosk.dll,libstdc++-6.dll,libgcc_s_seh-1.dll,libwinpthread-1.dll} "$D/"
          cp vl/sherpa-onnx-v1.13.8-win-x64-shared-MT-Release/lib/{sherpa-onnx-c-api.dll,onnxruntime.dll} "$D/"
          rm -rf vl
          ls -la "$D"
          # DLL — в ресурсы установщика (папка voice-libs рядом с Tuk.exe). tauri.windows.conf.json
          # Tauri сам сливает с tauri.conf.json при сборке под Windows; в git его нет, чтобы
          # локальная сборка без DLL не падала.
          node -e '
            const fs = require("fs");
            const res = {};
            for (const f of fs.readdirSync("src-tauri/voice-libs")) res["voice-libs/" + f] = "voice-libs/" + f;
            fs.writeFileSync("src-tauri/tauri.windows.conf.json", JSON.stringify({ bundle: { resources: res } }, null, 2));
          '
          cat src-tauri/tauri.windows.conf.json

      - name: Сборка установщика
        run: npx tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: Tuk-Windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Выкладывает готовые файлы в Releases — их видно в приложении GitHub и на сайте
  release:
    name: Публикация в Releases
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find out -type f | sed 's/^/  /'
          mkdir -p files
          APK=$(find out -name '*.apk' | head -n 1)
          if [ -n "$APK" ]; then cp "$APK" files/Tuk-android.apk; fi
          find out -name '*.exe' -exec cp {} files/ \;
          ls -la files
          TAG="build-${{ github.run_number }}"
          NOTES="Сборка №${{ github.run_number }}. Android: ${{ needs.android.result }}, Windows: ${{ needs.windows.result }}.
          На телефоне скачайте Tuk-android.apk, на ПК — файл *setup.exe."
          gh release create "$TAG" files/* --repo "${{ github.repository }}" --title "Тук, сборка ${{ github.run_number }}" --notes "$NOTES" --latest
